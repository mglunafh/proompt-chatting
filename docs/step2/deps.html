 and retired manually through the disable below. Reduced: no audit row, and is_admin is a boolean rather than MOD-01's ordered role."}, {"id": "W-14", "kind": "task", "row": 8, "name": "Credential rate limiting", "desc": "In-memory Caffeine counters over login and invite redemption: per source IP on both, per username on login, with progressive delay on the username dimension and a harder cap on the IP dimension. Counted on failures rather than attempts, and every failure logged as a structured record. Tested with virtual time, so the delay is asserted rather than waited on."}, {"id": "W-18", "kind": "task", "row": 8, "name": "Heartbeat and expiry", "desc": "The server tick and the client reply, a close after consecutive missed replies, and the work behind each tick: re-read the session row, close the socket if it is gone or expired, and refresh last_used_at. The reply is exempt from any interaction limit. Tested on virtual time against a row deleted and a row expired under an open socket."}, {"id": "W-19", "kind": "task", "row": 8, "name": "Revocation reach", "desc": "Every revoke path closing its sockets through the registry: logout with 4401, logout-everywhere across the user's sessions, and disable with 4403. A socket authenticates once at the upgrade and never revisits the table, so this is what makes revocation instant rather than eventual. Tested by revoking against a live in-process socket and asserting the code it sees."}, {"id": "W-20", "kind": "task", "row": 8, "name": "Presence edges and grace", "desc": "Online broadcast on 0→1 and offline on 1→0, to every other connected session and never to the user's own, with the offline frame delayed by a coroutine Job per user that a reconnect cancels outright. Session churn between the edges emits nothing. Tested on virtual time: a second socket is silent, a reconnect inside the window cancels, one outside it fires."}, {"id": "W-24", "kind": "task", "row": 8, "name": "Send path and fan-out", "desc": "Validate the body, persist, then ack the sender with the server-assigned id and timestamp and fan out to every live session of both participants, the sender's own included. Persist before delivering, so anything a client has seen is re-fetchable. Tested with the recipient connected twice and with the recipient absent."}, {"id": "W-27", "kind": "task", "row": 8, "name": "Client account commands", "desc": "Register, login and logout as Clikt subcommands, with passwords prompted and read without echo, never accepted as an option or an environment variable, and typed twice at registration."}, {"id": "W-28", "kind": "task", "row": 8, "name": "Client connection and reconnect", "desc": "Connect with the stored token, concurrent send and receive loops, exponential backoff with jitter on a drop, and a halt only on a close code the client knows: 4401 discards the token and asks for credentials, 4403 discards it and stops, 4409 keeps it and offers a manual reconnect. An unrecognized code, a missing one, 1001 and 1006 all mean retry. Tested against a server that closes with each."}, {"id": "AUTH-05", "kind": "feature", "row": 8, "name": "Request authentication", "desc": "Authorization: Bearer <token> on REST, and on WebSocket validated once at the upgrade. Identity is the token throughout: nothing a client asserts about who it is reaches the server. Reduced: the heartbeat's session lookup joins nothing, since no role can change under an open socket."}, {"id": "MSG-02", "kind": "feature", "row": 8, "name": "Conversation list", "desc": "The conversations a user belongs to, ordered by last activity with the last message attached, fetched over REST at startup. Rows carry their members' ids and usernames, which is what lets a client render a message that references users by id. Reduced: no unread counts and no mention tally, which are the layer over a read cursor this step does not have."}, {"id": "MSG-03", "kind": "feature", "row": 8, "name": "Message history", "desc": "Scrollback fetched over REST in server-capped pages, keyed on the message id rather than an offset so a concurrent write cannot shift a page. Reduced: paged before an id only; the after a change_seq half of the same endpoint belongs to"}, {"id": "W-21", "kind": "task", "row": 9, "name": "Presence snapshot", "desc": "The roster as the first frame after the upgrade, taken from the registry operation that added the socket, reporting broadcast state rather than the raw count so a user inside their grace window still reads as online. Entries carry a user id and username. Tested with three in-process clients, one of them mid-grace."}, {"id": "W-22", "kind": "task", "row": 9, "name": "Last seen", "desc": "Last_seen_at written when a user's socket count reaches zero, stamped then rather than when the grace expires, and the boot repair raising each user's value to the newest last_used_at across their sessions where that is later. Tested by killing the server with a socket open and asserting the repair on the next boot."}, {"id": "AUTH-02", "kind": "feature", "row": 9, "name": "Registration", "desc": "Accounts are created by redeeming an admin-issued single-use invite, presented with a new username and password. Reduced: admin-only issuance, so no allow_user_invites flag and no quota; single-use only; no listing and no revocation; and the bare token rather than a link, which nothing in a JVM console client can open."}, {"id": "AUTH-04", "kind": "feature", "row": 9, "name": "Login", "desc": "Verify the password, generate a 256-bit random token, insert a session row holding hash(token), and return the raw token once. Reduced: no second factor, so a verified password issues a session directly."}, {"id": "AUTH-06", "kind": "feature", "row": 9, "name": "Logout and revocation", "desc": "Logout deletes the session row, logout-everywhere deletes every row for the user, and both close the affected live sockets. Reduced: no session listing and no killing one by id."}, {"id": "AUTH-11", "kind": "feature", "row": 9, "name": "Token lifetime", "desc": "An absolute expires_at on the row, checked on every REST lookup and on each heartbeat tick, which is the only check that catches an expiry mid-connection. Reduced: no sliding renewal and no idle reaping."}, {"id": "MOD-06", "kind": "feature", "row": 9, "name": "Ban", "desc": "Reduced to an admin disable, where an admin disables an account and re-enables it: the flag is set, sessions deleted, live sockets closed and unredeemed invites revoked. The server refuses to disable its last active admin. It is in the step because AUTH-03 seeds a credential whose retirement procedure requires exactly this, and without it the seed password is permanent. Reduced: admins only, no mod role, no silence, no kick, no audit row."}, {"id": "MSG-01", "kind": "feature", "row": 9, "name": "Direct messages", "desc": "A send names a recipient by username; the body is validated, written to Postgres against the direct conversation for that canonical pair, acknowledged to the sender with its server-assigned id and timestamp, and fanned out to every live session of both participants. A message to a disconnected user is durable but not delivered until they reconnect. Messages hang off a conversation container with membership rows even though direct is the only kind, which is a schema shape rather than extra scope. Reduced: no change_seq, so a dropped fan-out is recovered by paging history rather than by a cursor walk; no edit, delete, reply, forward, reaction or mention."}, {"id": "MSG-04", "kind": "feature", "row": 9, "name": "Live connection", "desc": "One WebSocket per session, authenticated at the upgrade, carrying typed client and server frames from a module both sides depend on, with the protocol version checked once at the upgrade rather than on every frame. The server ticks a heartbeat and the client's reply proves liveness; reconnect is client-driven with backoff and stops only on an application close code. A rejected client frame comes back as a typed error frame rather than a close. Reduced: the tick carries neither the head change_seq nor a roster digest, since neither catch-up nor reconciliation is in this step."}, {"id": "SEC-02", "kind": "feature", "row": 9, "name": "Credential rate limiting", "desc": "The two routes that take a secret without a session: login and invite redemption. Failures are counted per source IP on both and per username on login, keyed on failures rather than attempts, so a user with a working password never meets it. Reduced: no password-reset route to cover, and the IP is the socket peer, since no proxy is pinned in front of the server yet."}, {"id": "ST2-02", "kind": "feature", "row": 9, "name": "Client account commands", "desc": "Register, login and logout, with passwords prompted and read without echo rather than taken as arguments, and typed twice where one is set."}, {"id": "USR-04", "kind": "feature", "row": 9, "name": "Presence", "desc": "Who is currently connected, per user rather than per session, counted off the connection registry and never persisted. Broadcast to every other connected session on the 0→1 and 1→0 edges only, with offline delayed by a short grace so a blip does not flicker every roster; the offline frame carries last_seen_at. Reduced: no declared status, and no profile-change broadcast, since nothing renameable exists yet."}, {"id": "W-29", "kind": "task", "row": 10, "name": "Client rendering", "desc": "Inert rendering of message bodies and usernames on the way to the terminal, covering history pages and conversation rows as well as live frames, plus the id-to-name map built from the presence snapshot and the presence frames after it."}, {"id": "USR-05", "kind": "feature", "row": 10, "name": "Presence snapshot", "desc": "The full roster pushed as the first frame after the upgrade, captured by the same registry operation that adds the socket. Entries carry a user id and a username: nothing renames in this step, so a client caches the mapping from the frames it already receives rather than resolving ids against an endpoint. Reduced: no digest on the heartbeat and no reconciliation."}, {"id": "USR-07", "kind": "feature", "row": 10, "name": "Last seen", "desc": "Last_seen_at on the user row, written when a user's last socket drops and repaired at startup from the newest session activity, since a hard kill runs no disconnect handler. Means last connected rather than last active."}, {"id": "W-30", "kind": "task", "row": 11, "name": "Client commands", "desc": "@name addressing a recipient, and the / commands beside it: /help, /exit, /list printing the conversation list, /history paging the current conversation backwards, /who printing the roster. An unrecognized /word refused as a command. Table-driven tests on the parse, and the README."}, {"id": "SEC-09", "kind": "feature", "row": 11, "name": "Client-side sanitization", "desc": "A client renders untrusted text inertly rather than obeying it, since its untrusted input is the socket rather than the person typing. Covers message bodies arriving from a history page as well as from a live frame, and usernames arriving on presence frames and conversation rows."}, {"id": "ST2-03", "kind": "feature", "row": 12, "name": "Client commands", "desc": "Two sigils divide the grammar a typed line is read under: @ addresses a recipient, / addresses the client. /help names what can be typed, /exit closes the connection, /list prints the conversation list, /history pages the current conversation backwards, and /who prints the roster."}], "order": [["W-01", "W-02"], ["W-01", "W-06"], ["W-01", "W-07"], ["W-01", "W-26"], ["W-02", "W-03"], ["W-03", "W-04"], ["W-03", "W-23"], ["W-04", "W-05"], ["W-04", "W-08"], ["W-04", "W-09"], ["W-04", "W-23"], ["W-05", "W-11"], ["W-05", "W-12"], ["W-05", "W-17"], ["W-05", "W-22"], ["W-06", "W-16"], ["W-06", "W-17"], ["W-06", "W-28"], ["W-07", "W-08"], ["W-07", "W-13"], ["W-07", "W-24"], ["W-08", "W-10"], ["W-08", "W-11"], ["W-08", "W-13"], ["W-08", "W-15"], ["W-08", "W-23"], ["W-09", "W-12"], ["W-09", "W-13"], ["W-09", "W-16"], ["W-09", "W-18"], ["W-09", "W-22"], ["W-10", "W-13"], ["W-10", "W-15"], ["W-11", "W-15"], ["W-12", "W-13"], ["W-12", "W-15"], ["W-12", "W-17"], ["W-12", "W-25"], ["W-13", "W-14"], ["W-13", "W-19"], ["W-13", "W-27"], ["W-15", "W-19"], ["W-16", "W-17"], ["W-16", "W-20"], ["W-16", "W-21"], ["W-16", "W-24"], ["W-17", "W-18"], ["W-17", "W-19"], ["W-17", "W-20"], ["W-17", "W-21"], ["W-17", "W-24"], ["W-17", "W-28"], ["W-20", "W-21"], ["W-20", "W-22"], ["W-21", "W-29"], ["W-23", "W-24"], ["W-23", "W-25"], ["W-24", "W-30"], ["W-25", "W-30"], ["W-26", "W-27"], ["W-26", "W-28"], ["W-28", "W-29"], ["W-29", "W-30"]], "coverage": [["W-23", "MSG-01"], ["W-24", "MSG-01"], ["W-23", "MSG-02"], ["W-25", "MSG-02"], ["W-23", "MSG-03"], ["W-25", "MSG-03"], ["W-06", "MSG-04"], ["W-17", "MSG-04"], ["W-18", "MSG-04"], ["W-28", "MSG-04"], ["W-09", "AUTH-01"], ["W-16", "AUTH-01"], ["W-10", "AUTH-02"], ["W-13", "AUTH-02"], ["W-27", "AUTH-02"], ["W-11", "AUTH-03"], ["W-08", "AUTH-04"], ["W-13", "AUTH-04"], ["W-27", "AUTH-04"], ["W-12", "AUTH-05"], ["W-17", "AUTH-05"], ["W-13", "AUTH-06"], ["W-19", "AUTH-06"], ["W-09", "AUTH-10"], ["W-09", "AUTH-11"], ["W-18", "AUTH-11"], ["W-16", "USR-04"], ["W-20", "USR-04"], ["W-16", "USR-05"], ["W-21", "USR-05"], ["W-22", "USR-07"], ["W-15", "MOD-06"], ["W-19", "MOD-06"], ["W-14", "SEC-02"], ["W-07", "SEC-05"], ["W-07", "SEC-06"], ["W-06", "SEC-07"], ["W-07", "SEC-07"], ["W-06", "SEC-08"], ["W-29", "SEC-09"], ["W-05", "OPS-01"], ["W-26", "ST2-01"], ["W-27", "ST2-02"], ["W-30", "ST2-03"]]}; /*__GRAPH_DATA__*/

  const NODES = GRAPH.nodes;
  const ORDER = GRAPH.order;
  const COVERAGE = GRAPH.coverage;

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const byId = new Map(NODES.map(n => [n.id, n]));
  const parents = new Map(NODES.map(n => [n.id, []]));
  const children = new Map(NODES.map(n => [n.id, []]));
  ORDER.forEach(([from, to]) => {
    parents.get(to).push(from);
    children.get(from).push(to);
  });

  const board = document.getElementById('board');
  const rowsEl = document.getElementById('rows');
  const svg = document.getElementById('edges');
  const statusEl = document.getElementById('status');
  const tip = document.getElementById('tip');
  const tipId = document.getElementById('tip-id');
  const tipDesc = document.getElementById('tip-desc');

  const els = new Map();
  const paths = [];
  let selected = null;

  function buildRows() {
    const depths = [...new Set(NODES.map(n => n.row))].sort((a, b) => a - b);
    depths.forEach(depth => {
      const row = document.createElement('div');
      row.className = 'row';

      const rail = document.createElement('div');
      rail.className = 'depth';
      rail.textContent = String(depth).padStart(2, '0');
      row.appendChild(rail);

      const lane = document.createElement('div');
      lane.className = 'lane';
      NODES.filter(n => n.row === depth).forEach(n => lane.appendChild(makeNode(n)));
      row.appendChild(lane);

      rowsEl.appendChild(row);
    });
  }

  function makeNode(n) {
    const el = document.createElement('button');
    el.className = 'node ' + n.kind;
    el.type = 'button';
    el.dataset.id = n.id;
    el.setAttribute('aria-pressed', 'false');

    const id = document.createElement('span');
    id.className = 'id';
    id.textContent = n.id;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = n.name;

    el.append(id, name);

    el.addEventListener('pointerenter', () => showTip(n, el));
    el.addEventListener('focus', () => showTip(n, el));
    el.addEventListener('pointerleave', hideTip);
    el.addEventListener('blur', hideTip);
    el.addEventListener('click', event => {
      event.stopPropagation();
      select(selected === n.id ? null : n.id);
    });

    els.set(n.id, el);
    return el;
  }

  function makePath(from, to, kind) {
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('class', kind);
    svg.appendChild(path);
    paths.push({ from, to, kind, path });
  }

  function buildEdges() {
    ORDER.forEach(([from, to]) => makePath(from, to, 'order'));
    COVERAGE.forEach(([from, to]) => makePath(from, to, 'coverage'));
  }

  function drawEdges() {
    const base = board.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
    svg.setAttribute('width', base.width);
    svg.setAttribute('height', base.height);

    paths.forEach(({ from, to, path }) => {
      const a = els.get(from).getBoundingClientRect();
      const b = els.get(to).getBoundingClientRect();
      const x1 = a.left - base.left + a.width / 2;
      const y1 = a.bottom - base.top;
      const x2 = b.left - base.left + b.width / 2;
      const y2 = b.top - base.top;
      const bend = Math.max((y2 - y1) * 0.45, 12);
      path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${y1 + bend}, ${x2} ${y2 - bend}, ${x2} ${y2}`);
    });
  }

  function ancestorsOf(ids) {
    const seen = new Set();
    const queue = [...ids];
    while (queue.length) {
      const current = queue.pop();
      (parents.get(current) || []).forEach(parent => {
        if (!seen.has(parent)) {
          seen.add(parent);
          queue.push(parent);
        }
      });
    }
    return seen;
  }

  function select(id) {
    selected = id;

    els.forEach((el, key) => {
      el.classList.remove('selected', 'direct', 'upstream');
      el.setAttribute('aria-pressed', String(key === id));
    });
    paths.forEach(({ path }) => path.classList.remove('active'));
    board.classList.toggle('has-selection', Boolean(id));

    if (!id) {
      renderStatus(null);
      return;
    }

    const node = byId.get(id);
    const isFeature = node.kind === 'feature';

    // Solid neighbours: for a feature, the tasks that complete it; for a task, the features it covers.
    const direct = isFeature
      ? COVERAGE.filter(([, feature]) => feature === id).map(([task]) => task)
      : COVERAGE.filter(([task]) => task === id).map(([, feature]) => feature);
    const upstream = isFeature
      ? [...ancestorsOf(direct)].filter(t => !direct.includes(t))
      : [...ancestorsOf([id])];
    const lit = isFeature ? new Set([...direct, ...upstream]) : new Set([id, ...upstream]);

    els.get(id).classList.add('selected');
    direct.forEach(n => els.get(n).classList.add('direct'));
    upstream.forEach(n => els.get(n).classList.add('upstream'));

    paths.forEach(({ from, to, kind, path }) => {
      const onOrder = kind === 'order' && lit.has(from) && lit.has(to);
      const onCoverage = kind === 'coverage' && (isFeature
        ? to === id && direct.includes(from)
        : from === id && direct.includes(to));
      if (onOrder || onCoverage) path.classList.add('active');
    });

    renderStatus({ node, direct, upstream });
  }

  function renderStatus(state) {
    statusEl.textContent = '';

    if (!state) {
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = 'Nothing selected. Click a feature for the tasks that complete it, or a task for what it waits on and what it feeds.';
      statusEl.appendChild(hint);
      return;
    }

    const { node, direct, upstream } = state;
    const heading = document.createElement('span');
    heading.className = 'heading ids';
    heading.textContent = `${node.id} ${node.name}`;
    statusEl.appendChild(heading);

    if (node.kind === 'feature') {
      statusEl.appendChild(field('Completed by', list(direct)));
      statusEl.appendChild(field('Waits on', list(upstream, 'nothing further')));
    } else {
      statusEl.appendChild(field('Waits on', list(upstream, 'nothing')));
      statusEl.appendChild(field('Unblocks', list(children.get(node.id), 'nothing')));
      statusEl.appendChild(field('Covers', list(direct, 'no feature')));
    }

    const clear = document.createElement('button');
    clear.type = 'button';
    clear.textContent = 'Clear';
    clear.addEventListener('click', () => select(null));
    statusEl.appendChild(clear);
  }

  function field(label, value) {
    // A fragment, not a wrapper: the label and the value are separate grid cells.
    const frag = document.createDocumentFragment();
    const key = document.createElement('span');
    key.className = 'label';
    key.textContent = label;
    const val = document.createElement('span');
    val.className = 'ids';
    val.textContent = value;
    frag.append(key, val);
    return frag;
  }

  function list(ids, empty) {
    return ids.length ? [...ids].sort().join('  ') : empty;
  }

  function showTip(node, el) {
    tipId.textContent = `${node.id} ${node.name}`;
    tipDesc.textContent = node.desc;
    tip.className = 'tip ' + node.kind;
    tip.dataset.open = 'true';
    tip.setAttribute('aria-hidden', 'false');

    const anchor = el.getBoundingClientRect();
    const box = tip.getBoundingClientRect();
    const margin = 10;
    let left = anchor.left + anchor.width / 2 - box.width / 2;
    left = Math.max(margin, Math.min(left, window.innerWidth - box.width - margin));
    let top = anchor.bottom + 10;
    if (top + box.height > window.innerHeight - margin) top = anchor.top - box.height - 10;
    tip.style.left = `${Math.round(left)}px`;
    tip.style.top = `${Math.round(Math.max(margin, top))}px`;
  }

  function hideTip() {
    tip.dataset.open = 'false';
    tip.setAttribute('aria-hidden', 'true');
  }

  buildRows();
  buildEdges();
  drawEdges();
  renderStatus(null);

  board.addEventListener('click', () => select(null));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') select(null);
  });
  new ResizeObserver(() => requestAnimationFrame(drawEdges)).observe(board);
  window.addEventListener('resize', () => requestAnimationFrame(drawEdges));
</script>
