[versions]
# Plugin versions
kotlin = "2.3.21"
ktlint = "14.2.0"

# BOM versions
ktor = "3.5.1"
coroutines = "1.11.0"
serialization = "1.11.0"
junit = "5.14.4"

# Library versions
clikt = "5.1.0"
logback = "1.6.1"

[libraries]
# BOMs
bom-ktor = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
bom-kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
bom-kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "serialization" }
bom-junit = { module = "org.junit:junit-bom", version.ref = "junit" }

# Libraries (version supplied by the BOMs above)
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Libraries (version of their own)
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
