name: chatting-step2

services:
  db:
    image: postgres:17-alpine
    container_name: db-step2
    environment:
      POSTGRES_DB: chatting
      POSTGRES_USER: chatting
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatting -d chatting"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  server:
    container_name: server-step2
    build:
      # The repository root, since settings.gradle.kts includes step1-simple too.
      context: ../..
      dockerfile: step2-durable/server/Dockerfile
    environment:
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/db_password
      SERVER_PORT: 8080
    secrets:
      - db_password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
